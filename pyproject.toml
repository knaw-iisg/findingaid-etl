[project]
name = "findingaid-etl"
version = "0.1.0"
description = "IISG finding-aid metadata ETL: EAD/OAI-PMH -> RDF"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.31",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["findingaid_etl*"]
